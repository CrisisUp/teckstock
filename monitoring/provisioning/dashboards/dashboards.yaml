# Grafana Dashboard Provisioning
# Auto-carregado pelo Grafana ao iniciar (arquivos em /etc/grafana/provisioning/dashboards/)
# Documentação: https://grafana.com/docs/grafana/latest/administration/provisioning/#dashboards

apiVersion: 1

providers:
  - name: 'TechStock Dashboards'
    orgId: 1
    folder: 'TechStock'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 300
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/dashboards
      foldersFromFilesStructure: true
    editable: false