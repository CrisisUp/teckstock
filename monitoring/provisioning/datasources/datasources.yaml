# Grafana Datasource Provisioning
# Auto-carregado pelo Grafana ao iniciar (arquivos em /etc/grafana/provisioning/datasources/)
# Documentação: https://grafana.com/docs/grafana/latest/administration/provisioning/#data-sources

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: PBFA97CFB590B2093
    access: proxy
    url: http://prometheus:9090
    accessMode: proxy
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "15s"
      queryTimeout: "60s"
    secureJsonData: {}